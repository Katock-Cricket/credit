<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CREDIT · 过程建模原型</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div>
          <h1 data-i18n="appTitle">CREDIT</h1>
          <div class="sub" data-i18n="appSub">过程建模与可视化原型 · P2-pre</div>
        </div>
        <div class="row" style="flex: none">
          <button
            id="btn-theme"
            style="flex: none; min-width: 64px"
            title="light / dark"
          >
            Dark
          </button>
          <button
            id="btn-locale"
            style="flex: none; min-width: 48px"
            title="zh-CN / en-US"
          >
            EN
          </button>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="control" aria-selected="true">
          <span data-i18n="tabControl">Control</span>
        </button>
        <button class="tab" role="tab" data-tab="history" aria-selected="false">
          <span data-i18n="tabHistory">History PRs</span>
        </button>
        <button class="tab" role="tab" data-tab="profile" aria-selected="false">
          <span data-i18n="tabProfile">Developer Profile</span>
        </button>
      </nav>

      <!-- ── Control Tab（P1 原样保留） ── -->
      <section id="view-control" class="view" role="tabpanel">
        <div id="banner" class="banner"></div>

        <div class="panel">
          <div class="row">
            <button id="btn-start" class="primary" data-i18n="btnStart">
              开始记录
            </button>
            <button id="btn-finish" data-i18n="btnFinish">结束并保存</button>
            <button id="btn-reset" class="danger" data-i18n="btnReset">
              放弃本轮记录
            </button>
          </div>
          <div class="msg" id="msg"></div>
        </div>

        <div class="panel">
          <dl class="kv">
            <dt data-i18n="lblState">状态</dt>
            <dd><span id="state" class="state idle">-</span></dd>
            <dt data-i18n="lblPrId">prId</dt>
            <dd><code id="prid">-</code></dd>
            <dt data-i18n="lblSeq">行为序号</dt>
            <dd id="seq">0</dd>
            <dt data-i18n="lblCounts">事件计数</dt>
            <dd id="counts">-</dd>
            <dt data-i18n="lblStats">治理统计</dt>
            <dd id="stats">-</dd>
            <dt data-i18n="lblDirs">数据目录</dt>
            <dd><code id="dirs">-</code></dd>
          </dl>
        </div>

        <div class="panel">
          <div class="row">
            <button id="btn-recover" data-i18n="btnRecover">
              模拟重启（重跑恢复）
            </button>
            <button id="btn-refresh" data-i18n="btnRefresh">刷新状态</button>
          </div>
        </div>
      </section>

      <!-- ── History PRs Tab（P2-pre 新增） ── -->
      <section id="view-history" class="view" role="tabpanel" hidden>
        <div class="history">
          <aside>
            <div class="panel">
              <h2 data-i18n="lblPrList">历史 PR</h2>
              <div id="pr-list" class="pr-list"></div>
            </div>
          </aside>

          <main class="gantt-wrap">
            <div class="panel">
              <h2 data-i18n="lblTimeline">过程时间线</h2>
              <div id="gantt-host"></div>
              <div class="hint" data-i18n="hintClickTask">
                点击 Task 块查看详情；色深为人工主导，色浅为 AI 主导。
              </div>
              <!-- 建模状态提示（如 LLM 未启用而走规则降级）：仅一行，不单列模块 -->
              <div id="model-hint" class="hint" hidden></div>
              <div class="row" style="margin-top: 12px">
                <button
                  id="recompute"
                  data-i18n="btnRecompute"
                  style="flex: none; min-width: 140px"
                  hidden
                >
                  重新计算（忽略缓存）
                </button>
              </div>
            </div>

            <div class="panel">
              <h2 data-i18n="lblAnalytics">过程分析</h2>
              <div id="analytics" class="analytics"></div>
            </div>

            <!-- ── P2：PR_Credit 指标树（计算时机在 Task 之后） ── -->
            <div class="panel">
              <div class="row" style="justify-content: space-between; align-items: baseline">
                <h2 data-i18n="lblCreditTree">PR_Credit 指标树</h2>
                <button
                  id="credit-recompute"
                  data-i18n="btnRecomputeCredit"
                  style="flex: none; min-width: 120px"
                  hidden
                >
                  重新计算
                </button>
              </div>
              <div id="credit-summary" class="credit-summary" hidden></div>
              <div id="credit-tree" class="credit-tree"></div>
              <div id="credit-hint" class="hint" hidden></div>
            </div>

            <div id="detail" class="detail" hidden></div>
          </main>
        </div>
      </section>
      <!-- ── Developer Profile Tab（P3 新增） ── -->
      <section id="view-profile" class="view" role="tabpanel" hidden>
        <div class="panel">
          <h2 data-i18n="lblProfileStatus">画像状态</h2>
          <dl class="kv">
            <dt data-i18n="lblInitState">初始化</dt>
            <dd><span id="pf-state" class="state idle">-</span></dd>
            <dt data-i18n="lblGitUser">git 用户</dt>
            <dd><code id="pf-gituser">-</code></dd>
            <dt data-i18n="lblPrStats">git PR 统计</dt>
            <dd id="pf-prstats">-</dd>
            <dt data-i18n="lblUpdatedAt">最近更新</dt>
            <dd id="pf-updated">-</dd>
          </dl>
        </div>

        <div class="panel">
          <h2 data-i18n="lblProfileOps">操作</h2>
          <div class="row">
            <input
              id="pf-home-url"
              type="text"
              placeholder="https://github.com/&lt;user&gt;"
              style="flex: 1; min-width: 200px; min-height: 32px"
            />
            <button id="pf-init" class="primary" data-i18n="btnProfileInit">
              git 初始化
            </button>
          </div>
          <div class="row">
            <button id="pf-sync" data-i18n="btnProfileSync">增量同步 git</button>
            <button id="pf-update-pr" data-i18n="btnProfileUpdatePr">
              从本地 PR 增量更新
            </button>
            <button id="pf-refresh" data-i18n="btnRefresh">刷新</button>
          </div>
          <div class="hint" data-i18n="hintProfileInit">
            未初始化时填入 git 主页地址发起初始化；已初始化可用增量同步。初始化需草稿确认后计分。
          </div>
          <div class="msg" id="pf-msg"></div>
        </div>

        <div class="panel" id="pf-draft-panel" hidden>
          <h2 data-i18n="lblDraft">初始化草稿（确认前不计分）</h2>
          <div id="pf-draft-body"></div>
          <div class="row">
            <button id="pf-confirm" class="primary" data-i18n="btnConfirmDraft">
              确认并落盘
            </button>
            <button id="pf-discard" class="danger" data-i18n="btnDiscardDraft">
              放弃草稿
            </button>
          </div>
        </div>

        <div class="panel">
          <h2 data-i18n="lblTechDomain">主领域关键词（双轨）</h2>
          <div id="pf-keywords"></div>
        </div>

        <div class="panel">
          <h2 data-i18n="lblHistoryTasks">本地历史 PR</h2>
          <div id="pf-tasks"></div>
        </div>
      </section>
    </div>

    <script type="module" src="/ui.js"></script>
  </body>
</html>
